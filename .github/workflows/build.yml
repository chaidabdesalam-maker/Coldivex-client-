name: Build COLDIVEX CLIENT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: unzip -q ColdivexClient-phone-build.zip

      - name: Build JAR
        run: cd ColdivexClient && gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: coldivex-client-jar
          path: ColdivexClient/build/libs/*.jar
          
